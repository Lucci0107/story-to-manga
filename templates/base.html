<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f2ed">
    <title>{% block title %}Story to Manga{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=5">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="{{ url_for('static', path='js/app.js') }}?v=7" defer></script>
  </body>
</html>
