services:
  - type: web
    name: story-to-manga
    runtime: python
    # SQLiteと生成ファイルを永続化するdiskを使うため、Freeではなく現行Starter相当を明示する。
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: openai
      - key: IMAGE_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_RESPONSES_URL
        value: https://api.openai.com/v1/responses
      - key: OPENAI_MODELS_URL
        value: https://api.openai.com/v1/models
      - key: OPENAI_IMAGE_URL
        value: https://api.openai.com/v1/images/generations
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_TIMEOUT_SECONDS
        value: "90"
      - key: OPENAI_MAX_RETRIES
        value: "1"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "12000"
      - key: STORYBOARD_JOB_STALE_SECONDS
        value: "900"
      - key: STORYBOARD_BATCH_PAGES
        value: "8"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: SESSION_DAYS
        value: "14"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: STORY_MANGA_DATA_DIR
        value: /var/data/story-manga
    disk:
      name: story-manga-data
      mountPath: /var/data
      sizeGB: 1
